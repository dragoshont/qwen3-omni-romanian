name: Validate research scaffold

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile published scripts
        run: python -m compileall -q scripts tests
      - name: Run dependency-light integrity tests
        run: python -m unittest discover -s tests -v
